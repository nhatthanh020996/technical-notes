# ---------------------------------------------------------------------------
# REPLACE EVERY VALUE BELOW BEFORE APPLYING.
#
# Committing this file as-is puts plaintext credentials in git. For anything
# beyond a scratch cluster use Sealed Secrets, External Secrets Operator, or
# SOPS instead, and delete this file.
#
# Generate values with:  openssl rand -base64 24 | tr -d '/+=' | cut -c1-24
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: demo
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: CHANGEME_postgres_password
  # Pre-composed connection string so the app never has to interpolate a
  # password itself. Keep user/password/db in sync with the values above and
  # with POSTGRES_DB in app-config.
  DATABASE_URL: postgresql://appuser:CHANGEME_postgres_password@postgres.demo.svc.cluster.local:5432/appdb?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: demo
type: Opaque
stringData:
  REDIS_PASSWORD: CHANGEME_redis_password
  REDIS_URL: redis://:CHANGEME_redis_password@redis.demo.svc.cluster.local:6379/0
