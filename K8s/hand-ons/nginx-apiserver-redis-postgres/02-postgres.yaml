# ---------------------------------------------------------------------------
# Postgres: single replica StatefulSet + PersistentVolumeClaim.
#
# One replica is deliberate. Multi-primary Postgres is not something you get
# from replicas: 3 — it needs an operator (CloudNativePG, Zalando, Crunchy) or
# a managed service. See README for when to make that jump.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo
  labels:
    app.kubernetes.io/name: postgres
spec:
  # Headless: gives the pod the stable DNS name postgres-0.postgres.demo.svc
  # while postgres.demo.svc still resolves for normal clients.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: demo
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999          # 'postgres' uid in the Debian-based image
        runAsGroup: 999
        fsGroup: 999            # makes the mounted volume group-writable
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          # Prefer to keep the database off whichever node Redis landed on, so
          # a single node loss doesn't take out both stateful components.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: redis
      containers:
        - name: postgres
          image: postgres:16.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # Init into a subdirectory. Many volume types drop a lost+found at
            # the mount root, which makes initdb refuse to run.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - -c
            - max_connections=200
            - -c
            - shared_buffers=256MB
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi        # no CPU limit: throttling a DB hurts tail latency
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            # Generous: first boot runs initdb, and crash recovery can be slow.
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: standard   # uncomment to pin a specific class
        resources:
          requests:
            storage: 10Gi
