apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

commonLabels:
  app.kubernetes.io/part-of: demo-stack

resources:
  - 00-namespace.yaml
  - 01-secrets.yaml
  - 02-postgres.yaml
  - 03-redis.yaml
  - 04-api-server.yaml
  - 05-nginx.yaml
  - 06-networkpolicy.yaml

# Override the placeholder image without editing the Deployment.
images:
  - name: ghcr.io/example/api-server
    newName: ghcr.io/example/api-server
    newTag: 1.0.0
