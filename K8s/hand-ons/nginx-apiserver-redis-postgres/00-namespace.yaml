apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    name: demo
---
# Non-sensitive settings shared by the app tier.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo
data:
  POSTGRES_DB: appdb
  POSTGRES_HOST: postgres.demo.svc.cluster.local
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis.demo.svc.cluster.local
  REDIS_PORT: "6379"
  APP_PORT: "8080"
  LOG_LEVEL: info
